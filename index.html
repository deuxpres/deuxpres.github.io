<style>
:root{
  --ink      : #14101A;
  --ink-up   : #1E1826;
  --ink-edge : #2E2639;
  --brass    : #C9A46A;
  --brass-hi : #DCBB84;
  --flare    : #E0489A;
  --paper    : #EDE6DC;
  --quote    : #C6B39A;   /* 인용문 — 종이가 바랜 듯한 따뜻한 톤 */
  --muted    : #8B8195;

  --serif : "Gowun Batang", serif;
  --sans  : "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;

  /* ★ 표지 칸 너비. 제목이 두 줄로 넘어가면 이 값을 키우세요 */
  --cover-w : 200px;   /* 표지 칸 너비 */
  --page-w  : 620px;   /* 페이지 전체 폭 — 줄이면 표가 좁아집니다 */
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  background: var(--ink);
  color: var(--paper);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(110% 55% at 10% 0%, rgba(201,164,106,.09), transparent 62%);
  padding: 0 28px;
}
.wrap{ max-width: var(--page-w); margin: 0 auto; }

/* ── 한글+영문 짝 맞춤 (이 페이지의 기본 장치) ─────────── */
.kr{ font-family: var(--serif); font-weight:700; display:flex; align-items:baseline; flex-wrap:wrap; }
.en{
  font-family: var(--sans); font-weight:300;
  text-transform: uppercase; letter-spacing:.2em;
  color: var(--brass); margin-left:.6em; white-space:nowrap;
}

/* ── 머리말 ───────────────────────────────────────────── */
.top{ padding: 68px 0 0; }

/* ★ 이름 크기 조절: 한글은 아래 font-size, 영문은 .name .en 의 font-size */
.name{ font-size: clamp(31px,6.2vw,46px); line-height:1.1; }
.name .en{ font-size:.32em; }

.intro{ margin-top:26px; font-size:14.5px; line-height:1.85; word-break:keep-all; }
.notes{ margin-top:14px; font-size:12.5px; line-height:1.8; color:var(--muted); word-break:keep-all; }
.notes p::before{ content:"※ "; color:var(--brass); }

.contacts{ margin-top:26px; display:flex; flex-direction:column; gap:7px; font-size:14px; }
.contacts a{
  color:var(--paper); text-decoration:none;
  display:inline-flex; align-items:center; gap:9px; width:fit-content;
  transition:color .18s;
}
.contacts a:hover, .contacts a:focus-visible{ color:var(--brass); }

/* ── 금색 섹션 박스 — 여기부터 작품 목록 ──────────────── */
.section{
  margin-top: 54px;
  padding: 14px 20px;
  border-radius: 2px 2px 0 0;
  background: linear-gradient(180deg, var(--brass-hi), var(--brass));
  color: var(--ink);
  font-size: 19px; line-height:1.2;
  box-shadow: 0 6px 20px rgba(201,164,106,.14);
}
.section .en{ color: rgba(20,16,26,.6); font-size:.6em; }

/* ── 작품 ─────────────────────────────────────────────── */
.list{ padding-bottom:72px; }
.work{ padding-top:30px; }
.work:first-child{ padding-top:22px; }

/* 연도 구분선 — 출간일(date)의 앞 4자리가 바뀔 때만 나옵니다 */
.year{
  display:flex; align-items:center; gap:12px; margin-bottom:13px;
  font-size:11.5px; letter-spacing:.24em; color:var(--brass);
  font-variant-numeric:tabular-nums;
}
.year::after{
  content:""; flex:1; height:1px;
  background:linear-gradient(90deg, rgba(201,164,106,.5), transparent);
}

.card{
  background:var(--ink-up);
  border:1px solid var(--ink-edge);
  border-radius:3px;
  padding:22px;
  display:grid;
  grid-template-columns: var(--cover-w) 1fr;
  gap:24px;
  transition:border-color .2s;
}
.card:hover{ border-color:rgba(201,164,106,.38); }

/* 왼쪽 — 표지 / 제목 / 출간일·출판사 */
.left{ width:var(--cover-w); }
.left img{ width:100%; height:auto; display:block; border-radius:2px; box-shadow:0 10px 26px rgba(0,0,0,.55); }
.left .ph{
  width:100%; aspect-ratio:5/7; border-radius:2px; border:1px dashed var(--ink-edge);
  display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px; letter-spacing:.1em;
}
.title{
  font-family:var(--serif); font-weight:700; font-size:20px;
  margin-top:16px; white-space:nowrap;      /* 줄바꿈 금지 */
}
.meta{
  margin-top:6px; font-size:12.5px; color:var(--muted);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.meta i{ color:var(--brass); font-style:normal; margin:0 5px; }

/* ==================================================================== */
/*                                                                      */
/*    ★★  카드 오른쪽 글자 스타일은 전부 여기 있습니다  ★★             */
/*                                                                      */
/*    나오는 순서   소개문 → 인용문 → 윗줄 → 태그 → 아랫줄 → 유통처   */
/*                                                                      */
/*    고치는 방법                                                       */
/*      글자 크기   font-size    숫자만 바꾸면 됩니다                   */
/*      글자 색     color        var(--paper)  밝은 미색                */
/*                               var(--quote)  바랜 종이 톤             */
/*                               var(--brass)  금색                     */
/*                               var(--muted)  회색                     */
/*      서체        font-family  var(--serif)  명조(고운바탕)           */
/*                               var(--sans)   고딕(프리텐다드)         */
/*      줄 간격     line-height  1.7 → 1.9 로 올리면 넓어집니다         */
/*      윗 여백     margin-top   바로 위 문단과의 거리                  */
/*                                                                      */
/* ==================================================================== */
.right{ display:flex; flex-direction:column; min-width:0; }

/* ① 소개문 ─ 고딕. 명조로 되돌리려면 var(--sans) 를 var(--serif) 로 */
.pitch{
  font-family:var(--sans); font-weight:450;
  font-size:14px; line-height:1.72;
  color:var(--paper); word-break:keep-all;
}

/* ② 인용문 ─ 명조. 따옴표는 화면에서 자동으로 붙습니다 */
.quote{
  margin-top:14px;
  font-family:var(--serif);
  font-size:14px; line-height:1.8;
  letter-spacing:.015em;
  color:var(--quote); word-break:keep-all;
}
.quote::before{ content:"“"; color:var(--brass); }
.quote::after { content:"”"; color:var(--brass); }

/* ③ 태그 윗줄 ─ 장르, 배경 같은 짧은 분류에 */
.above{
  margin-top:15px;
  font-size:11px; line-height:1.7; letter-spacing:.05em;
  color:var(--brass); opacity:.88; word-break:keep-all;
}

/* ④ 태그 */
.tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:13px; }
.tags span{
  font-size:12px; color:var(--brass);
  background:rgba(201,164,106,.07);
  border:1px solid rgba(201,164,106,.2);
  border-radius:2px; padding:3px 7px; white-space:nowrap;
}

/* ⑤ 태그 아랫줄 ─ 주의사항, 비고에 */
.below{
  margin-top:13px;
  font-size:11.5px; line-height:1.75;
  color:var(--muted); word-break:keep-all;
}

/* ⑥ 유통처 */
.storeHead{
  margin-top:auto; padding-top:20px;
  font-size:11.5px; letter-spacing:.06em; color:var(--muted);
  border-top:1px solid var(--ink-edge);
  font-family:var(--sans); font-weight:400;
}
.storeHead .en{ color:var(--muted); font-size:.85em; letter-spacing:.16em; margin-left:.45em; }
.right > .storeHead:first-child{ margin-top:0; border-top:0; padding-top:0; }

.stores{
  list-style:none; margin-top:10px;
  display:grid; grid-template-columns:repeat(3,1fr); gap:1px 10px;
}
.stores a{
  display:block; padding:5px 0; font-size:13.5px;
  color:var(--paper); text-decoration:none; white-space:nowrap;
  transition:color .16s;
}
.stores a::before{
  content:"▸"; color:var(--brass); font-size:10px;
  margin-right:6px; display:inline-block; transition:transform .16s;
}
.stores a:hover, .stores a:focus-visible{ color:var(--flare); }
.stores a:hover::before, .stores a:focus-visible::before{ color:var(--flare); transform:translateX(3px); }

/* ⑦ 미유통 ─ links 에서 주소를 "" 로 비우면 이렇게 나옵니다 */
.stores .off{
  display:block; padding:5px 0; font-size:13.5px;
  color:var(--muted); white-space:nowrap; opacity:.7;
}
.stores .off::before{
  content:"–"; font-size:10px; margin-right:6px; display:inline-block;
}
.stores .off i{ font-style:normal; text-decoration:line-through; }

/* ⑧ 유통처 아랫줄 안내 */
.storeNote{
  margin-top:11px; font-size:11.5px; line-height:1.65;
  color:var(--muted); word-break:keep-all;
}

.soon{ font-size:13px; color:var(--muted); letter-spacing:.06em; }

.foot{ padding-bottom:64px; font-size:11px; letter-spacing:.1em; color:var(--muted); }

/* ── 모바일 ───────────────────────────────────────────── */
@media (max-width:700px){
  body{ padding:0 26px; }        /* 모바일 바깥 여백 */
  .top{ padding-top:48px; }
  .section{ margin-top:44px; padding:12px 16px; font-size:17px; }
  .card{ grid-template-columns:1fr; gap:20px; padding:18px; }
  .left{ width:100%; max-width:var(--cover-w); }
  .storeHead{ margin-top:0; }
}

/* 아주 좁은 화면에서는 유통처를 2열로. 3열을 고집하려면 이 블록을 지우세요 */
@media (max-width:430px){
  .stores{ grid-template-columns:repeat(2,1fr); }
}

/* 문제가 생겼을 때만 보이는 안내 */
#boot{
  margin-top:60px; padding:18px 20px; border-radius:3px;
  border:1px solid var(--flare); background:rgba(224,72,154,.09);
  color:var(--paper); font-size:13.5px; line-height:1.75; word-break:break-all;
}
#boot b{ color:var(--flare); display:block; margin-bottom:6px; font-size:14px; }

a:focus-visible{ outline:2px solid var(--brass); outline-offset:3px; }
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>


<div class="wrap">
  <div id="boot">페이지를 불러오는 중…</div>
  <header class="top">
    <h1 class="name kr" id="name"></h1>
    <div class="intro" id="intro"></div>
    <div class="notes" id="notes"></div>
    <nav class="contacts" id="contacts"></nav>
  </header>

  <h2 class="section kr" id="sub"></h2>
  <main class="list" id="list"></main>
  <p class="foot" id="foot"></p>
</div>


<script>
(function(){
 const boot = document.getElementById('boot');
 try{
  if (typeof PROFILE === 'undefined' || typeof WORKS === 'undefined')
    throw new Error('PROFILE 또는 WORKS 를 못 찾았습니다. 데이터 블록에 따옴표나 쉼표가 빠졌을 가능성이 큽니다.');

  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const pair = (ko,en) => esc(ko) + (en ? '<span class="en">'+esc(en)+'</span>' : '');

  document.title = PROFILE.nameKo + ' ' + PROFILE.titleKo;
  document.getElementById('name').innerHTML = pair(PROFILE.nameKo, PROFILE.nameEn);
  document.getElementById('sub').innerHTML  = pair(PROFILE.titleKo, PROFILE.titleEn);

  document.getElementById('intro').innerHTML =
    (PROFILE.intro||[]).map(t => '<p>'+esc(t)+'</p>').join('');
  document.getElementById('notes').innerHTML =
    (PROFILE.notes||[]).map(t => '<p>'+esc(t)+'</p>').join('');
  document.getElementById('contacts').innerHTML =
    (PROFILE.contacts||[]).map(c =>
      '<a href="'+esc(c.url)+'"'+(c.url.startsWith('mailto:')?'':' target="_blank" rel="noopener"')+'>'+
      '<span aria-hidden="true">'+esc(c.icon)+'</span>'+esc(c.text)+'</a>').join('');

  /* 유통처를 STORE_ORDER 순으로 정렬 (없는 이름은 뒤로) */
  const rank = s => { const i = STORE_ORDER.indexOf(s); return i < 0 ? 999 : i; };

  const sorted = WORKS.slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));
  let lastYear = null;

  document.getElementById('list').innerHTML = sorted.map(w => {
    const year = (w.date||'').slice(0,4);
    const showYear = year !== lastYear; lastYear = year;

    const cover = w.cover
      ? '<img src="'+esc(w.cover)+'" alt="'+esc(w.title)+' 표지" loading="lazy" '+
        'onerror="this.outerHTML=\'<div class=&quot;ph&quot;>표지 준비 중</div>\'">'
      : '<div class="ph">표지 준비 중</div>';

    const pitch = w.pitch ? '<p class="pitch">'+esc(w.pitch)+'</p>' : '';
    const quote = w.quote ? '<p class="quote">'+esc(w.quote)+'</p>' : '';
    const above = w.above ? '<p class="above">'+esc(w.above)+'</p>' : '';
    const below = w.below ? '<p class="below">'+esc(w.below)+'</p>' : '';
    const tags  = (w.tags||[]).length
      ? '<div class="tags">'+w.tags.map(t=>'<span>#'+esc(t)+'</span>').join('')+'</div>' : '';

    const names = Object.keys(w.links||{}).sort((a,b)=>rank(a)-rank(b));
    const cell = n => {                       /* 주소가 비면 회색 취소선 */
      const v = String(w.links[n] || '');
      return /^https?:/i.test(v)
        ? '<li><a href="'+esc(v)+'" target="_blank" rel="noopener">'+esc(n)+'</a></li>'
        : '<li><span class="off"><i>'+esc(n)+'</i></span></li>';
    };
    const note = w.storeNote ? '<p class="storeNote">'+esc(w.storeNote)+'</p>' : '';
    const stores = w.soon
      ? '<p class="storeHead">출간 예정<span class="en">Coming soon</span></p>'
      : (names.length
          ? '<p class="storeHead">유통처<span class="en">Stores</span></p>'+
            '<ul class="stores">'+names.map(cell).join('')+'</ul>'+note
          : '');

    return '<article class="work">'+
      (showYear ? '<span class="year">'+esc(year)+'</span>' : '')+
      '<div class="card">'+
        '<div class="left">'+cover+
          '<h2 class="title">'+esc(w.title)+'</h2>'+
          '<p class="meta">'+esc((w.date||'').replace(/-/g,'.'))+
            (w.label ? '<i>·</i>'+esc(w.label) : '')+'</p>'+
        '</div>'+
        '<div class="right">'+pitch+quote+above+tags+below+stores+'</div>'+
      '</div></article>';
  }).join('');

  document.getElementById('foot').textContent =
    '수록 '+sorted.length+'종 · 최종 수정 '+new Date().toISOString().slice(0,10).replace(/-/g,'.');

  boot.remove();                    /* 여기까지 오면 정상 */

 }catch(e){
  const raw = window.__bootErr || String(e && e.message ? e.message : e);
  boot.innerHTML = '<b>페이지를 그리지 못했습니다</b>' +
    raw.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) +
    '<br><br>가장 흔한 원인은 두 가지입니다. ' +
    '글 안에 곧은 따옴표 " 를 쓴 경우, 그리고 줄 끝 쉼표를 빠뜨린 경우. ' +
    '위에 줄 번호가 있으면 그 줄부터 보세요.';
 }
})();
</script>

</body>
</html>
